services:
  - type: web
    name: cloud-student-task-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m flask --app run.py db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
