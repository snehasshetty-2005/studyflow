{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-card"><a class="brand auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">S</span><span>studyflow</span></a><div class="auth-heading"><span class="eyebrow">WELCOME BACK</span><h1>Good to see you.</h1><p>Sign in to pick up where you left off.</p></div>
{% if errors.get('form') %}<div class="form-alert" role="alert">{{ errors.form }}</div>{% endif %}
<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required value="{{ email }}" placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"><button class="button button-primary button-wide" type="submit">Sign in <span aria-hidden="true">→</span></button></form>
<p class="auth-switch">New to StudyFlow? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>
{% endblock %}
